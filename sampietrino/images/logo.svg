<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Sampietrino — Roma &amp; Buenos Aires">
  <title>Sampietrino</title>
  <defs>
    <path id="arc-top" d="M 22,100 A 78,78 0 0,1 178,100"/>
    <path id="arc-bot" d="M 36,100 A 64,64 0 0,0 164,100"/>
    <clipPath id="clip-left">
      <rect x="0" y="0" width="100" height="200"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="100" y="0" width="100" height="200"/>
    </clipPath>
    <clipPath id="clip-circle">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Background — cream -->
  <circle cx="100" cy="100" r="100" fill="#F5EFE6"/>

  <!-- Subtle half-tints -->
  <rect x="0" y="0" width="100" height="200" fill="#B85C38" opacity="0.07" clip-path="url(#clip-circle)"/>
  <rect x="100" y="0" width="100" height="200" fill="#1F5F9E" opacity="0.07" clip-path="url(#clip-circle)"/>

  <!-- Outer gold ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#C8922A" stroke-width="1.8"/>
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="83" fill="none" stroke="#C8922A" stroke-width="0.5" opacity="0.5"/>

  <!-- SAMPIETRINO — top arc, bold blue -->
  <text font-family="Georgia,'Times New Roman',serif" font-size="13.5"
        font-weight="700" fill="#1F5F9E" letter-spacing="4.5">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">SAMPIETRINO</textPath>
  </text>

  <!-- Tagline -->
  <text x="100" y="58" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="5" fill="#7A6B62" letter-spacing="1.4">ROMA  &amp;  BUENOS AIRES</text>

  <!-- Upper separator -->
  <line x1="48" y1="63" x2="152" y2="63" stroke="#C8922A" stroke-width="0.5" opacity="0.45"/>

  <!-- COLOSSEUM — left half, terracotta -->
  <g clip-path="url(#clip-left)">
    <rect x="54" y="80" width="52" height="46" fill="#B85C38"/>
    <!-- Upper arched windows -->
    <rect x="57" y="86" width="10" height="9" fill="#F5EFE6"/>
    <ellipse cx="62" cy="86" rx="5" ry="4.5" fill="#F5EFE6"/>
    <rect x="70" y="86" width="10" height="9" fill="#F5EFE6"/>
    <ellipse cx="75" cy="86" rx="5" ry="4.5" fill="#F5EFE6"/>
    <rect x="83" y="86" width="10" height="9" fill="#F5EFE6"/>
    <ellipse cx="88" cy="86" rx="5" ry="4.5" fill="#F5EFE6"/>
    <!-- Mid cornice -->
    <rect x="54" y="97" width="52" height="1.2" fill="#8A4A28" opacity="0.55"/>
    <!-- Lower arches -->
    <rect x="57" y="110" width="10" height="16" fill="#F5EFE6"/>
    <ellipse cx="62" cy="110" rx="5" ry="4.5" fill="#F5EFE6"/>
    <rect x="70" y="110" width="10" height="16" fill="#F5EFE6"/>
    <ellipse cx="75" cy="110" rx="5" ry="4.5" fill="#F5EFE6"/>
    <rect x="83" y="110" width="10" height="16" fill="#F5EFE6"/>
    <ellipse cx="88" cy="110" rx="5" ry="4.5" fill="#F5EFE6"/>
  </g>

  <!-- OBELISK — right half, blue -->
  <g clip-path="url(#clip-right)">
    <polygon points="123,76 133,76 128,68" fill="#1F5F9E"/>
    <polygon points="121,122 135,122 133,76 123,76" fill="#1F5F9E"/>
    <rect x="118" y="122" width="20" height="3.5" fill="#1F5F9E"/>
  </g>

  <!-- Centre divider -->
  <line x1="100" y1="69" x2="100" y2="128" stroke="#C8922A" stroke-width="0.6" opacity="0.35"/>
  <circle cx="100" cy="100" r="2" fill="#C8922A" opacity="0.75"/>

  <!-- Lower separator -->
  <line x1="48" y1="130" x2="152" y2="130" stroke="#C8922A" stroke-width="0.5" opacity="0.45"/>

  <!-- ROMA ★ BUENOS AIRES — bottom arc, gold -->
  <text font-family="Georgia,'Times New Roman',serif" font-size="7.8"
        fill="#C8922A" letter-spacing="1.8">
    <textPath href="#arc-bot" startOffset="50%" text-anchor="middle">ROMA  ★  BUENOS AIRES</textPath>
  </text>
</svg>
